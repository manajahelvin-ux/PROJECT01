[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe-ai"
version = "0.1.0"
description = "Application desktop de transcription video/audio assistee par OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
transcribe-ai = "transcribe_ai.main:main"

[tool.setuptools.packages.find]
include = ["transcribe_ai*"]

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests longs (telechargement, transcription reelle)",
    "gui: tests necessitant un affichage Qt",
    "integration: tests d'integration inter-couches",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["transcribe_ai"]
omit = ["*/resources/*", "*/__init__.py"]

# --------------------------------------------------------------------------- #
# Qualite
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["N818"]  # nos exceptions suivent une convention de nommage explicite

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "N802", "N806"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["build/", "dist/", "\\.venv/"]
